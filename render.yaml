# One-service deployment: the API, the admin panel and the storefront all
# served from a single origin, so there is no CORS and no second host.
#
# The database is Postgres on Supabase (DATABASE_URL below) — external to
# this service, so it survives redeploys on its own. The disk mounted here is
# for uploaded product photos only: without it, they would live on this
# container's own filesystem and be wiped on every redeploy. Disks require a
# paid instance type on Render.
services:
  - type: web
    name: ynr-shop
    runtime: node
    plan: starter          # free instances have no persistent disk
    rootDir: server
    # rootDir alone only redeploys on changes under server/ — but this
    # service serves the storefront too, from ../storefront. Without this,
    # a storefront-only change would never reach the live site.
    # Paths here are relative to the repo root, not to rootDir.
    buildFilter:
      paths:
        - server/**
        - storefront/**
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health

    # Render adds www.ynrfashion.com automatically. DNS lives on Cloudflare:
    # CNAME @ and www -> ynr-shop.onrender.com, both "DNS only" (not
    # proxied) so Render can verify the domain and issue its certificate.
    domains:
      - ynrfashion.com

    disk:
      name: ynr-uploads
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production

      # Product photos live on the mounted disk, not the container itself.
      - key: UPLOADS_DIR
        value: /var/data/uploads

      # This service's own public URL. Without it, the Paystack callback,
      # the newsletter confirm/unsubscribe links, and the CORS allow-list
      # all silently fall back to localhost — meaning real customers would
      # be sent to a URL that only exists on a developer's own machine.
      # Same value for both because one origin serves everything. The
      # ynr-shop.onrender.com address keeps working alongside it.
      - key: SITE_URL
        value: https://ynrfashion.com
      - key: API_URL
        value: https://ynrfashion.com

      # Supabase: Project Settings -> Database -> Connection string -> URI.
      # Use the Session pooler (port 5432) — this is a long-running server
      # with its own connection pool, not a serverless function, so it does
      # not need the transaction-mode pooler serverless deployments require.
      - key: DATABASE_URL
        sync: false

      # Signs admin sessions. Render generates this once and keeps it.
      - key: SESSION_SECRET
        generateValue: true

      # Loads the starting catalogue on first boot, when there is no shell.
      - key: AUTO_SEED
        value: "1"

      # Creates the first admin on first boot. Change the password after the
      # first sign-in, then delete ADMIN_PASSWORD from the dashboard.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Set once the Paystack account is approved. Until then the shop takes
      # orders and confirms them on WhatsApp.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false

      # Order notifications. Without SMTP_URL, mail is recorded in the outbox
      # table and visible in the admin panel rather than being sent.
      - key: OWNER_EMAIL
        value: Ynrfashion93@gmail.com
      # Resend only sends from a domain verified with DNS records (see the
      # resend._domainkey / send / rsend records on Cloudflare), and it has
      # no inbox — replies go to OWNER_EMAIL via Reply-To instead.
      - key: MAIL_FROM
        value: "YnR <orders@ynrfashion.com>"
      # Secret — set in the Render dashboard, never in this file:
      #   smtps://resend:<RESEND_API_KEY>@smtp.resend.com:465
      - key: SMTP_URL
        sync: false

      - key: WHATSAPP_NUMBER
        value: "2349026947815"
      - key: HOLD_MINUTES
        value: "30"
