# One-service deployment: the API, the admin panel and the storefront all
# served from a single origin, so there is no CORS and no second host.
#
# The database is Postgres on Supabase (DATABASE_URL below) — external to
# this service, so it survives redeploys on its own. The disk mounted here is
# for uploaded product photos only: without it, they would live on this
# container's own filesystem and be wiped on every redeploy. Disks require a
# paid instance type on Render.
services:
  - type: web
    name: ynr-shop
    runtime: node
    plan: starter          # free instances have no persistent disk
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health

    disk:
      name: ynr-uploads
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production

      # Product photos live on the mounted disk, not the container itself.
      - key: UPLOADS_DIR
        value: /var/data/uploads

      # Supabase: Project Settings -> Database -> Connection string -> URI.
      # Use the Session pooler (port 5432) — this is a long-running server
      # with its own connection pool, not a serverless function, so it does
      # not need the transaction-mode pooler serverless deployments require.
      - key: DATABASE_URL
        sync: false

      # Signs admin sessions. Render generates this once and keeps it.
      - key: SESSION_SECRET
        generateValue: true

      # Loads the starting catalogue on first boot, when there is no shell.
      - key: AUTO_SEED
        value: "1"

      # Creates the first admin on first boot. Change the password after the
      # first sign-in, then delete ADMIN_PASSWORD from the dashboard.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Set once the Paystack account is approved. Until then the shop takes
      # orders and confirms them on WhatsApp.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false

      # Order notifications. Without SMTP_URL, mail is recorded in the outbox
      # table and visible in the admin panel rather than being sent.
      - key: OWNER_EMAIL
        sync: false
      - key: SMTP_URL
        sync: false

      - key: WHATSAPP_NUMBER
        value: "2349026947815"
      - key: HOLD_MINUTES
        value: "30"
